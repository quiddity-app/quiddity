[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz", "apps/app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/quiddity-app/quiddity"
rust-version = "1.88"

[workspace.dependencies]
quiddity-core = { path = "crates/core" }
quiddity-identity = { path = "crates/identity" }
quiddity-syntax = { path = "crates/syntax" }
# No time zone database: the UI only needs civil dates and timestamps.
jiff = { version = "0.2", default-features = false, features = ["std"] }
loro = "1.17"
proptest = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
# Only to read and write quiddity.toml.
# Unicode normalisation and case folding for names and search; see `quiddity_syntax::normalise_name`.
caseless = "0.2"
unicode-normalization = "0.1"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "display"] }
uuid = { version = "1", features = ["v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
