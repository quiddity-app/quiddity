name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue re-runs the checks on the PR merged with whatever is ahead
  # of it. Mutation testing and fuzzing are skipped there: the PR has already
  # passed them, and neither depends on what it's merged with.
  merge_group:

permissions:
  contents: read

# A new push supersedes the PR's previous run. Queue and main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # What cargo-fuzz builds with. Pinned to a day so that the fuzz jobs'
  # cache, which keys on rustc's version, stays valid between bumps; Renovate
  # moves it weekly.
  FUZZ_TOOLCHAIN: nightly-2026-11-16

jobs:
  lint:
    # Everything that doesn't run the tests, so that it overlaps with them.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust
    - run: cargo fmt --all --check
    - run: cargo clippy --all-targets --locked -- -D warnings
    - run: cargo doc --no-deps --locked
      env:
        RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust cargo:cargo-nextest
    - run: cargo nextest run --locked --profile ci
    - run: cargo test --doc --locked

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: node
        mbx: "false"
    - run: node --test scripts/*.test.mjs

  typecheck:
    # Apart from `ui` so that it overlaps with the browser tests. It builds the
    # WASM itself, which tsc needs for the types, and mbx caches that. ESLint's
    # type-aware rules need those types too, so it is checked here as well.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust node pnpm cargo:wasm-bindgen-cli
        node: true
    - run: pnpm install --frozen-lockfile
    - run: pnpm ui typecheck
    - run: pnpm ui lint

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The UI embeds the graph replica, which is the core compiled to WASM, so
    # it needs the wasm-bindgen CLI that mise.toml pins to the crate's version.
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust node pnpm cargo:wasm-bindgen-cli
        node: true
    - run: pnpm install --frozen-lockfile
    - run: pnpm ui build
    - id: playwright
      run: echo "version=$(pnpm --filter @quiddity/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    # Playwright's system libraries are the slow part of this job: the Azure
    # mirror can take minutes. The packages it asks for change with its version.
    - uses: $/.github/actions/apt-cache
      with:
        hash: ${{ steps.playwright.outputs.version }}
    - id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: steps.browsers.outputs.cache-hit != 'true'
      run: pnpm --filter @quiddity/ui exec playwright install --with-deps chromium
    # The browser is cached, but the system libraries it needs are installed
    # each time, from the packages cached above.
    - if: steps.browsers.outputs.cache-hit == 'true'
      run: pnpm --filter @quiddity/ui exec playwright install-deps chromium
    - run: sudo scripts/apt-prune.sh
    - run: pnpm ui test:e2e
    - if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-traces
        path: apps/ui/test-results/

  site:
    # The documentation site is the one published build, and Pages builds it
    # only after a merge, so a change that breaks it would be found there.
    # This builds it as Pages does, and checks that each named page is drawn in
    # its HTML (scripts/check-export.mjs). It needs the node binary, which
    # `ui` doesn't, so it is a job of its own.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust node pnpm cargo:wasm-bindgen-cli
        node: true
    - run: pnpm install --frozen-lockfile
    # The device's key goes in a directory of its own, not the runner's.
    - run: cargo run --locked -p quiddity-node -- -g "$RUNNER_TEMP/graph" init
      env:
        QUIDDITY_CONFIG_DIR: ${{ runner.temp }}/keys
    - run: cargo run --locked -p quiddity-node -- -g "$RUNNER_TEMP/graph" import docs
      env:
        QUIDDITY_CONFIG_DIR: ${{ runner.temp }}/keys
    - run: cargo run --locked -p quiddity-node -- -g "$RUNNER_TEMP/graph" snapshot "$RUNNER_TEMP/graph/graph.loro"
      env:
        QUIDDITY_CONFIG_DIR: ${{ runner.temp }}/keys
    # Stops here if two pages share a name.
    - run: cargo run --locked -p quiddity-node -- -g "$RUNNER_TEMP/graph" names "$RUNNER_TEMP/graph/names.txt"
      env:
        QUIDDITY_CONFIG_DIR: ${{ runner.temp }}/keys
    - run: pnpm ui build
      env:
        QUIDDITY_STATIC_GRAPH: ${{ runner.temp }}/graph/graph.loro
    - run: node scripts/check-export.mjs apps/ui/out "$RUNNER_TEMP/graph/names.txt"

  app:
    # The shell's Rust, which is all there is to check: its tests never load
    # the UI, so this needs neither Node nor the WASM build, which the ui job
    # already proves.
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/apt-cache
      with:
        hash: ${{ hashFiles('.github/workflows/ci.yml') }}
    - run: >-
        sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
    - run: sudo scripts/apt-prune.sh
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust
    # tauri's generate_context! embeds the UI's build and fails if its
    # directory is missing. Empty is enough for fmt, clippy and the tests.
    - run: mkdir -p apps/ui/out
    - working-directory: apps/app/src-tauri
      env:
        # mbx 1.29 runs build scripts through a `#!/bin/sh` wrapper, and dash
        # (Ubuntu's sh) drops environment variables whose names aren't valid
        # identifiers. tauri passes its core permissions to tauri-build as
        # DEP_TAURI_CORE:PATH__... and the like, so with the wrapper they go
        # missing and generate_context! fails with SetPermissionNotFound. Run
        # build scripts directly; compilation is still cached. Drop this once
        # mbx stops using sh for the wrapper.
        MBX_BUILD_SCRIPT_EXECUTION: 0
      run: |
        cargo fmt --check
        cargo clippy --all-targets --locked -- -D warnings
        cargo test --locked

  android:
    # Builds the app for Android, which nothing else does: the Kotlin plugin that
    # syncs in the background (a WorkManager job and a foreground service), the
    # JNI calls it makes into the library, and that the whole links for the
    # target. It is the release's build (`release.yml`) without the signing and
    # the UI, as a debug build for one ABI: the others add minutes and prove
    # nothing more. The Android SDK and NDK are on the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # 21, not the release's 25: the plugin's tests run on Robolectric, which
    # supports up to there. The build proves the same either way.
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 21
    # Not cached by mbx: Tauri runs cargo from Gradle, and what it does with
    # cross builds isn't something to find out here.
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust node pnpm
        node: true
        mbx: "false"
    - run: rustup target add aarch64-linux-android
    - run: pnpm install --frozen-lockfile --filter @quiddity/app...
    # tauri's generate_context! embeds the UI's build and fails if its
    # directory is missing. Empty is enough to compile.
    - run: mkdir -p apps/ui/out
    - name: Generate the Android project
      working-directory: apps/app
      run: |
        export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        pnpm tauri android init --ci
    - name: Build it
      working-directory: apps/app
      run: |
        export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        pnpm tauri android build --debug --apk --target aarch64 --ci \
          --config '{"build":{"beforeBuildCommand":null}}'
    # The plugin's dependency versions are locked (`gradle.lockfile`), so that
    # the build doesn't move under us. Writing the locks and finding a
    # difference means the file is stale: refresh it as the plugin's
    # build.gradle.kts says. The diff is the new file, to commit.
    - name: Check the plugin's Gradle lock is current
      working-directory: apps/app/src-tauri/gen/android
      run: |
        ./gradlew :tauri-plugin-background-sync:dependencies --write-locks > /dev/null
        cd "$GITHUB_WORKSPACE"
        git add --intent-to-add apps/app/plugins/background-sync/android/gradle.lockfile
        git diff --exit-code -- apps/app/plugins/background-sync/android/gradle.lockfile
    # The Kotlin plugin's tests, on Robolectric, in the generated project that
    # includes it. The coverage report is what SonarCloud reads (`sonarcloud`),
    # since it can't measure Kotlin any other way.
    - name: Test the Kotlin plugin
      working-directory: apps/app/src-tauri/gen/android
      run: ./gradlew :tauri-plugin-background-sync:createDebugUnitTestCoverageReport
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kotlin-coverage
        path: apps/app/plugins/background-sync/android/build/reports/coverage/test/debug/report.xml
        if-no-files-found: error
    - if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kotlin-test-reports
        path: apps/app/plugins/background-sync/android/build/reports/tests/

  changes:
    # Works out what the run needs to do: which fuzz targets, and whether
    # there is any Rust to mutate. The merge queue has nothing to decide.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      fuzz: ${{ steps.fuzz.outputs.targets }}
      rust: ${{ steps.rust.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    # An empty range, as for a new branch, means every target. So does a range
    # git can't resolve, such as the commits before a forced push.
    - id: fuzz
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        range=
        case "$EVENT" in
          pull_request) range="origin/${BASE_REF}...HEAD" ;;
          push) range="${BEFORE}..HEAD" ;;
        esac
        echo "targets=$(node scripts/fuzz-targets.mjs "$range")" >> "$GITHUB_OUTPUT"
    # cargo-mutants only mutates the lines a diff changes in Rust files.
    - id: rust
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -q '\.rs$'; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  mutants:
    # Every mutant in the lines a PR changes must be caught by some test. There
    # is no diff to mutate on a push, the merge queue relies on the PR's run,
    # and a PR that changes no Rust has nothing to mutate.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # A baseline build and test of about two minutes, then about 14 seconds a
    # mutant: 20 minutes held only about 60, which a PR that adds a store
    # exceeds on its own (105 for the SQLite blob store, which was cancelled,
    # not failed). An hour is room for about 230.
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust cargo:cargo-nextest cargo:cargo-mutants
        # The same test builds as the test job's, so the same cache.
        cache: test
    - run: git diff "origin/${GITHUB_BASE_REF}..." > pr.diff
    - run: cargo mutants --in-place --in-diff pr.diff --timeout-multiplier 3
      env:
        PROPTEST_CASES: 64
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mutants
        path: mutants.out/

  fuzz:
    # Continuous fuzzing of the PR and of main; the merge queue adds nothing.
    # Only the targets whose code changed, and an empty matrix is an error, so
    # when none did the job is skipped instead.
    needs: changes
    if: github.event_name != 'merge_group' && needs.changes.outputs.fuzz != '[]'
    runs-on: ubuntu-latest
    # The minute of fuzzing is the small part. With no cache to restore, the
    # dependencies are built under the sanitizer first: `block` took over
    # three and a half minutes that way, and `peer`, which reaches more
    # crates, ran out of five.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.fuzz) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust cargo:cargo-fuzz
        mbx: "false"
    - run: rustup toolchain install "${FUZZ_TOOLCHAIN}" --profile minimal
    # mbx bypasses almost every compilation under cargo-fuzz's sanitizer flags,
    # so it never has anything to save. rust-cache keeps the dependencies'
    # build instead; main saves it and pull requests restore it. It keys on
    # rustc's version, so it must see the nightly that cargo-fuzz builds with.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      env:
        RUSTUP_TOOLCHAIN: ${{ env.FUZZ_TOOLCHAIN }}
      with:
        workspaces: fuzz
        key: ${{ matrix.target }}
        save-if: ${{ github.event_name == 'push' }}
    - run: mkdir -p "fuzz/corpus/${MATRIX_TARGET}"
      env:
        MATRIX_TARGET: ${{ matrix.target }}
    # The prebuilt cargo-fuzz otherwise targets musl, which isn't installed.
    - env:
        MATRIX_TARGET: ${{ matrix.target }}
      run: >-
        cargo "+${FUZZ_TOOLCHAIN}" fuzz run --target x86_64-unknown-linux-gnu "${MATRIX_TARGET}" "fuzz/corpus/${MATRIX_TARGET}" "fuzz/seeds/${MATRIX_TARGET}" -- -max_total_time=60
    - if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-${{ matrix.target }}
        path: fuzz/artifacts/

  sonarcloud:
    # Static analysis and coverage (Rust's, and the Kotlin plugin's from the
    # `android` job), reported to SonarCloud. GitHub doesn't
    # give a PR from a fork an OIDC token, so it couldn't be analysed, and those
    # skip it (and the gate counts a skip as a pass). The merge queue has
    # already had the PR's result.
    needs: android
    if: github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Secretless analysis: the job proves who it is with GitHub's OIDC token
      # and SonarCloud hands back a short-lived one, so there is no secret.
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Sonar blames new code by history, so it needs all of it.
        fetch-depth: 0
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust cargo:cargo-nextest cargo:cargo-llvm-cov
    - run: rustup component add llvm-tools
    # nextest, as the test job runs it; doctests aren't instrumented.
    - run: cargo llvm-cov nextest --locked --profile ci --lcov --output-path lcov.info
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: kotlin-coverage
        path: kotlin-coverage
    # Right before the scan, since its token is short-lived.
    - uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
    - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
      with:
        # SonarCloud splits the Cargo workspace into a module per crate and
        # reads a relative path from each one's own directory, so only the root
        # found the report, and it couldn't place the crates' files. An absolute
        # path is the same from every module. Each module still logs the files
        # that belong to the others as "problems in LCOV report"; that is
        # expected, and not coverage lost.
        #
        # The Kotlin plugin's JaCoCo report comes from the `android` job.
        args: |
          -Dsonar.rust.lcov.reportPaths=${{ github.workspace }}/lcov.info
          -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/kotlin-coverage/report.xml

  gate:
    # The one check to require, so that adding, splitting or renaming a job
    # never means editing the branch protection. Its name is what the
    # protection matches, so keep it. Add every new job to `needs`. Jobs that
    # are skipped on purpose (the merge queue skips `changes`, `mutants`, `fuzz`
    # and `sonarcloud`; a change with no Rust or fuzzed code skips `mutants`
    # and `fuzz`; a fork's PR skips `sonarcloud`) count as a pass, so requiring the jobs themselves would hang the queue. `always()`
    # stops a failure upstream skipping this job, which would also count as a
    # pass; the check below fails on anything but success or skipped, which
    # includes a cancelled run.
    name: lint, build, test
    if: always()
    needs: [lint, test, scripts, ui, site, app, android, changes, mutants, fuzz, typecheck, sonarcloud]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
