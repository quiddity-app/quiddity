name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue re-runs the checks on the PR merged with whatever is ahead
  # of it. Mutation testing and fuzzing are skipped there: the PR has already
  # passed them, and neither depends on what it's merged with.
  merge_group:

permissions:
  contents: read

# A new push supersedes the PR's previous run. Queue and main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    # Everything that doesn't run the tests, so that it overlaps with them.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust
    - run: cargo fmt --all --check
    - run: cargo clippy --all-targets --locked
    - run: cargo doc --no-deps --locked
      env:
        RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust cargo:cargo-nextest
    - run: cargo nextest run --locked --profile ci
    - run: cargo test --doc --locked

  scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: node
        mbx: "false"
    - run: node --test scripts/*.test.mjs

  ui:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The UI embeds the graph replica, which is the core compiled to WASM, so
    # it needs the wasm-bindgen CLI that mise.toml pins to the crate's version.
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust node pnpm cargo:wasm-bindgen-cli
        node: true
    - run: pnpm install --frozen-lockfile
    - run: pnpm ui typecheck
    - run: pnpm ui build
    - id: playwright
      run: echo "version=$(pnpm --filter @quiddity/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - id: browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: steps.browsers.outputs.cache-hit != 'true'
      run: pnpm --filter @quiddity/ui exec playwright install --with-deps chromium
    # The browser is cached, but the system libraries it needs are not.
    - if: steps.browsers.outputs.cache-hit == 'true'
      run: pnpm --filter @quiddity/ui exec playwright install-deps chromium
    - run: pnpm ui test:e2e
    - if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-traces
        path: apps/ui/test-results/

  app:
    # The shell's Rust, which is all there is to check: its tests never load
    # the UI, so this needs neither Node nor the WASM build, which the ui job
    # already proves.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: >-
        sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust
    # tauri's generate_context! embeds the UI's build and fails if its
    # directory is missing. Empty is enough for fmt, clippy and the tests.
    - run: mkdir -p apps/ui/out
    - working-directory: apps/app/src-tauri
      env:
        # mbx 1.29 runs build scripts through a `#!/bin/sh` wrapper, and dash
        # (Ubuntu's sh) drops environment variables whose names aren't valid
        # identifiers. tauri passes its core permissions to tauri-build as
        # DEP_TAURI_CORE:PATH__... and the like, so with the wrapper they go
        # missing and generate_context! fails with SetPermissionNotFound. Run
        # build scripts directly; compilation is still cached. Drop this once
        # mbx stops using sh for the wrapper.
        MBX_BUILD_SCRIPT_EXECUTION: 0
      run: |
        cargo fmt --check
        cargo clippy --all-targets --locked
        cargo test --locked

  changes:
    # Works out what the run needs to do: which fuzz targets, and whether
    # there is any Rust to mutate. The merge queue has nothing to decide.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      fuzz: ${{ steps.fuzz.outputs.targets }}
      rust: ${{ steps.rust.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    # An empty range, as for a new branch, means every target. So does a range
    # git can't resolve, such as the commits before a forced push.
    - id: fuzz
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        range=
        case "$EVENT" in
          pull_request) range="origin/${BASE_REF}...HEAD" ;;
          push) range="${BEFORE}..HEAD" ;;
        esac
        echo "targets=$(node scripts/fuzz-targets.mjs "$range")" >> "$GITHUB_OUTPUT"
    # cargo-mutants only mutates the lines a diff changes in Rust files.
    - id: rust
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -q '\.rs$'; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  mutants:
    # Every mutant in the lines a PR changes must be caught by some test. There
    # is no diff to mutate on a push, the merge queue relies on the PR's run,
    # and a PR that changes no Rust has nothing to mutate.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust cargo:cargo-nextest cargo:cargo-mutants
        # The same test builds as the test job's, so the same cache.
        cache: test
    - run: git diff "origin/${GITHUB_BASE_REF}..." > pr.diff
    - run: cargo mutants --in-place --in-diff pr.diff --timeout-multiplier 3
      env:
        PROPTEST_CASES: 64
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mutants
        path: mutants.out/

  fuzz:
    # Continuous fuzzing of the PR and of main; the merge queue adds nothing.
    # Only the targets whose code changed, and an empty matrix is an error, so
    # when none did the job is skipped instead.
    needs: changes
    if: github.event_name != 'merge_group' && needs.changes.outputs.fuzz != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.fuzz) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust cargo:cargo-fuzz
        mbx: "false"
    - run: rustup toolchain install nightly --profile minimal
    # mbx bypasses almost every compilation under cargo-fuzz's sanitizer flags,
    # so it never has anything to save. rust-cache keeps the dependencies'
    # build instead; main saves it and pull requests restore it. It keys on
    # rustc's version, so it must see the nightly that cargo-fuzz builds with.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      env:
        RUSTUP_TOOLCHAIN: nightly
      with:
        workspaces: fuzz
        key: ${{ matrix.target }}
        save-if: ${{ github.event_name == 'push' }}
    - run: mkdir -p "fuzz/corpus/${MATRIX_TARGET}"
      env:
        MATRIX_TARGET: ${{ matrix.target }}
    # The prebuilt cargo-fuzz otherwise targets musl, which isn't installed.
    - env:
        MATRIX_TARGET: ${{ matrix.target }}
      run: >-
        cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "${MATRIX_TARGET}" "fuzz/corpus/${MATRIX_TARGET}" "fuzz/seeds/${MATRIX_TARGET}" -- -max_total_time=60
    - if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fuzz-${{ matrix.target }}
        path: fuzz/artifacts/

  gate:
    # The one check to require, so that adding, splitting or renaming a job
    # never means editing the branch protection. Its name is what the
    # protection matches, so keep it. Add every new job to `needs`. Jobs that
    # are skipped on purpose (the merge queue skips `changes`, `mutants` and
    # `fuzz`; a change with no Rust or fuzzed code skips the last two) count as
    # a pass, so requiring the jobs themselves would hang the queue. `always()`
    # stops a failure upstream skipping this job, which would also count as a
    # pass; the check below fails on anything but success or skipped, which
    # includes a cancelled run.
    name: lint, build, test
    if: always()
    needs: [lint, test, scripts, ui, app, changes, mutants, fuzz]
    runs-on: ubuntu-latest
    steps:
    - env:
        NEEDS: ${{ toJSON(needs) }}
      run: |
        echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
