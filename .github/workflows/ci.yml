name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue re-runs the checks on the PR merged with whatever is ahead
  # of it. Mutation testing and fuzzing are skipped there: the PR has already
  # passed them, and neither depends on what it's merged with.
  merge_group:

permissions:
  contents: read

# A new push supersedes the PR's previous run. Queue and main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust cargo:cargo-nextest
    - run: cargo fmt --all --check
    - run: cargo clippy --all-targets --locked
    - run: cargo nextest run --locked --profile ci
    - run: cargo test --doc --locked
    - run: cargo doc --no-deps --locked
      env:
        RUSTDOCFLAGS: -D warnings

  ui:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The UI embeds the graph replica, which is the core compiled to WASM, so
    # it needs the wasm-bindgen CLI that mise.toml pins to the crate's version.
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust node pnpm cargo:wasm-bindgen-cli
        node: true
    - run: pnpm install --frozen-lockfile
    - run: pnpm ui typecheck
    - run: pnpm ui build
    - id: playwright
      run: echo "version=$(pnpm --filter @quiddity/ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - id: browsers
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: steps.browsers.outputs.cache-hit != 'true'
      run: pnpm --filter @quiddity/ui exec playwright install --with-deps chromium
    # The browser is cached, but the system libraries it needs are not.
    - if: steps.browsers.outputs.cache-hit == 'true'
      run: pnpm --filter @quiddity/ui exec playwright install-deps chromium
    - run: pnpm ui test:e2e
    - if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: playwright-traces
        path: apps/ui/test-results/

  app:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: >-
        sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
    # The WASM build the UI needs for the shell goes through mbx.
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust node pnpm cargo:wasm-bindgen-cli
        node: true
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        # See here for caching with `yarn`, `bun` or other package managers https://github.com/actions/cache/blob/main/examples.md or you can leverage caching with actions/setup-node https://github.com/actions/setup-node
        path: |
          ${{ github.workspace }}/.next/cache
        # Generate a new cache whenever packages or source files change.
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
        # If source files changed but packages didn't, rebuild from a prior cache.
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.json') }}-
    - run: pnpm install --frozen-lockfile
    # The shell embeds the built UI.
    - run: pnpm ui build
    - working-directory: apps/app/src-tauri
      env:
        # mbx 1.29 runs build scripts through a `#!/bin/sh` wrapper, and dash
        # (Ubuntu's sh) drops environment variables whose names aren't valid
        # identifiers. tauri passes its core permissions to tauri-build as
        # DEP_TAURI_CORE:PATH__... and the like, so with the wrapper they go
        # missing and generate_context! fails with SetPermissionNotFound. Run
        # build scripts directly; compilation is still cached. Drop this once
        # mbx stops using sh for the wrapper.
        MBX_BUILD_SCRIPT_EXECUTION: 0
      run: |
        cargo fmt --check
        cargo clippy --all-targets --locked
        cargo test --locked

  mutants:
    # Every mutant in the lines a PR changes must be caught by some test. There
    # is no diff to mutate on a push, and the merge queue relies on the PR's run.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust cargo:cargo-nextest cargo:cargo-mutants
    - run: git diff "origin/${GITHUB_BASE_REF}..." > pr.diff
    - run: cargo mutants --in-place --in-diff pr.diff --timeout-multiplier 3
      env:
        PROPTEST_CASES: 64
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: mutants
        path: mutants.out/

  fuzz:
    # Continuous fuzzing of the PR and of main; the merge queue adds nothing.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [block, outline, peer]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: $/.github/actions/setup
      with:
        tools: cargo-binstall rust cargo:cargo-fuzz
        mbx: "false"
    # mbx bypasses almost every compilation under cargo-fuzz's sanitizer flags,
    # so it never has anything to save. Cache the target directory instead:
    # main saves it, and pull requests restore it and rebuild what changed.
    - id: fuzz-build
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: fuzz/target
        key: fuzz-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock', 'mise.toml') }}-${{ github.sha }}
        restore-keys: fuzz-${{ matrix.target }}-${{ hashFiles('fuzz/Cargo.lock', 'mise.toml') }}-
    - run: rustup toolchain install nightly --profile minimal
    - run: mkdir -p fuzz/corpus/${{ matrix.target }}
    # The prebuilt cargo-fuzz otherwise targets musl, which isn't installed.
    - run: >-
        cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} -- -max_total_time=60
    - if: success() && github.event_name == 'push'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: fuzz/target
        key: ${{ steps.fuzz-build.outputs.cache-primary-key }}
    - if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: fuzz-${{ matrix.target }}
        path: fuzz/artifacts/

  fuzz-gate:
    # The one fuzzing check to require. The matrix legs only exist when `fuzz`
    # runs, so requiring them by name would hang the merge queue, where it is
    # skipped. `always()` stops a failed `fuzz` skipping this job, which would
    # count as a pass.
    if: always()
    needs: fuzz
    runs-on: ubuntu-latest
    steps:
    - env:
        RESULT: ${{ needs.fuzz.result }}
      run: test "$RESULT" = success || test "$RESULT" = skipped
