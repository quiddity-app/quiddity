name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # The journals are written from the commit messages since the last one
        # saved, so they need the history.
        fetch-depth: 0
        persist-credentials: false
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
      with:
        tool: wasm-bindgen@0.2.130
    - run: pnpm install --frozen-lockfile
    # Journal entries live in commit messages until the Journals workflow saves
    # them; this writes the days it hasn't yet, today's included.
    - run: node scripts/journals.mjs
      env:
        GH_TOKEN: ${{ github.token }}
    # Import docs/ into a graph with the headless node...
    - run: cargo run --locked -p quiddity-node -- -g "$RUNNER_TEMP/graph" init
    - run: cargo run --locked -p quiddity-node -- -g "$RUNNER_TEMP/graph" import docs
    # ...then build the UI around that graph's snapshot.
    - run: pnpm ui build
      env:
        QUIDDITY_STATIC_GRAPH: ${{ runner.temp }}/graph
        QUIDDITY_BASE_PATH: /${{ github.event.repository.name }}
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: apps/ui/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
