name: Nightly

# Builds of every platform, kept as workflow artifacts. This is not a release:
# nothing is published, and GitHub deletes the artifacts after `retention-days`.

on:
  schedule:
  # Monday, 03:00 UTC.
  - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      ios:
        description: Also check that the app compiles for iOS (a stub; needs a macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RETENTION_DAYS: 90

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      # What names the artifacts: 2026-11-01-nightly.
      label: ${{ steps.version.outputs.label }}
      # What goes inside the apps. Tauri wants semantic versions, and the
      # Windows installers and Android's version code want numbers, so the
      # date is written as 2026.11.1. Android derives its version code from it
      # (major * 1,000,000 + minor * 1,000 + patch), which fits until 2099.
      semver: ${{ steps.version.outputs.semver }}
    steps:
    - id: version
      run: |
        echo "label=$(date -u +%F)-nightly" >> "$GITHUB_OUTPUT"
        echo "semver=$(date -u +%Y.%-m.%-d)" >> "$GITHUB_OUTPUT"

  ui:
    # Every app embeds the same UI, so it is built once.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
    - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
      with:
        tool: wasm-bindgen@0.2.130
    - run: pnpm install --frozen-lockfile
    - run: pnpm ui build
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ui
        path: apps/ui/out
        # Only the jobs below need it.
        retention-days: 1

  desktop:
    needs: [version, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: linux, arch: x64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu}
        - {os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
        # macOS builds both architectures on one (Apple silicon) runner.
        - {os: macos, arch: x64, runner: macos-latest, target: x86_64-apple-darwin}
        - {os: macos, arch: arm64, runner: macos-latest, target: aarch64-apple-darwin}
        - {os: windows, arch: x64, runner: windows-latest, target: x86_64-pc-windows-msvc}
        - {os: windows, arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc}
    runs-on: ${{ matrix.runner }}
    env:
      LABEL: ${{ needs.version.outputs.label }}
      SEMVER: ${{ needs.version.outputs.semver }}
      OS: ${{ matrix.os }}
      NAME: ${{ matrix.os }}-${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - if: matrix.os == 'linux'
      run: >-
        sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev rpm xdg-utils
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: |
          . -> target
          apps/app/src-tauri -> target
        key: ${{ matrix.target }}
    # Only the Tauri CLI is needed from the JavaScript side.
    - run: pnpm install --frozen-lockfile --filter @quiddity/app...
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ui
        path: apps/ui/out

    # The command line and headless sync node.
    - run: cargo build --release --locked -p quiddity-node --target "$TARGET"
    - name: Collect the node
      run: |
        mkdir -p dist
        bin=target/$TARGET/release
        if [ "$OS" = windows ]; then
          cp "$bin/quiddity-node.exe" "dist/quiddity-node-$LABEL-$NAME.exe"
        else
          # A tarball keeps the executable bit, which an artifact's zip drops.
          tar -C "$bin" -czf "dist/quiddity-node-$LABEL-$NAME.tar.gz" quiddity-node
        fi
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: quiddity-node-${{ env.LABEL }}-${{ env.NAME }}
        path: dist/quiddity-node-*
        if-no-files-found: error
        retention-days: ${{ env.RETENTION_DAYS }}

    # The app. The UI is already built, so the build hook is switched off, and
    # the version is the date.
    - name: Build the app
      working-directory: apps/app
      run: >-
        pnpm tauri build --target "$TARGET" --config "{\"version\":\"$SEMVER\",\"build\":{\"beforeBuildCommand\":null}}"
    - name: Collect the app
      run: |
        # The shell is outside the workspace, so it has its own target directory.
        bundles=apps/app/src-tauri/target/$TARGET/release/bundle
        mkdir -p dist-app
        # Installers and disk images, not the unpacked bundles beside them.
        for ext in deb rpm AppImage dmg msi; do
          find "$bundles" -type f -name "*.$ext" -exec cp {} dist-app/ \;
        done
        find "$bundles" -type f -name '*-setup.exe' -exec cp {} dist-app/ \;
        ls -l dist-app
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: quiddity-${{ env.LABEL }}-${{ env.NAME }}
        path: dist-app/*
        if-no-files-found: error
        retention-days: ${{ env.RETENTION_DAYS }}

  android:
    needs: [version, ui]
    runs-on: ubuntu-latest
    env:
      LABEL: ${{ needs.version.outputs.label }}
      SEMVER: ${{ needs.version.outputs.semver }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: 17
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: pnpm
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: apps/app/src-tauri -> target
    - run: pnpm install --frozen-lockfile --filter @quiddity/app...
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ui
        path: apps/ui/out
    # The Android project is generated rather than kept in the repository: it
    # holds nothing of ours yet. The runner image has the SDK and an NDK.
    - name: Generate the Android project
      working-directory: apps/app
      run: |
        export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        pnpm tauri icon src-tauri/icons/icon.png
        pnpm tauri android init --ci
    - name: Build the APK
      working-directory: apps/app
      run: |
        export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
        pnpm tauri android build --apk --ci \
          --config "{\"version\":\"$SEMVER\",\"build\":{\"beforeBuildCommand\":null}}"
    # A release APK is unsigned, and Android won't install one. A key in the
    # repository's secrets keeps updates installable over each other; without
    # one, a throwaway key signs it and each nightly must replace the last by
    # uninstalling it first.
    - name: Sign the APK
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        unsigned=$(find apps/app/src-tauri/gen/android -name '*-unsigned.apk' | head -n 1)
        test -n "$unsigned"
        apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
        keystore=$RUNNER_TEMP/nightly.jks
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
        else
          KEYSTORE_PASSWORD=$(openssl rand -hex 16)
          KEY_ALIAS=nightly
          keytool -genkeypair -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 3650 \
            -dname "CN=Quiddity nightly"
        fi
        mkdir -p dist
        "$apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
          --ks-key-alias "$KEY_ALIAS" --out "dist/quiddity-$LABEL-android.apk" "$unsigned"
        "$apksigner" verify "dist/quiddity-$LABEL-android.apk"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: quiddity-${{ env.LABEL }}-android
        path: dist/*.apk
        if-no-files-found: error
        retention-days: ${{ env.RETENTION_DAYS }}

  ios:
    # A stub. Signing needs an Apple developer team and certificates, which
    # this repository has none of, so this only proves that the shell
    # compiles for iOS. Building an IPA means `tauri ios init` and
    # `tauri ios build` with a team set; see docs/Nightly builds.md.
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        targets: aarch64-apple-ios,aarch64-apple-ios-sim
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: apps/app/src-tauri -> target
    # tauri-build wants the UI's directory to exist, not to be complete.
    - run: mkdir -p apps/ui/out
    - working-directory: apps/app/src-tauri
      run: |
        cargo check --lib --locked --target aarch64-apple-ios
        cargo check --lib --locked --target aarch64-apple-ios-sim
