[package]
name = "quiddity-app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/quiddity-app/quiddity"
rust-version = "1.91"
publish = false

[lib]
name = "quiddity_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quiddity-core = { path = "../../../crates/core" }
quiddity-node = { path = "../../../crates/node" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
thiserror = "2"

[dev-dependencies]
iroh = "=1.4.1"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt", "time"] }
