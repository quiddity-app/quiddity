# SonarCloud: https://sonarcloud.io/project/overview?id=quiddity-app_quiddity
# CI runs the scanner (the `sonarcloud` job in .github/workflows/ci.yml), so
# automatic analysis must stay off in the project's settings.
sonar.organization=quiddity
sonar.projectKey=quiddity-app_quiddity
sonar.projectName=Quiddity

# SonarCloud's analysis scope is the whole project, so there is no
# sonar.sources or sonar.tests: it ignores them and says so. What it shouldn't
# read, it is told here. Binary files are not text, and it warns about each.
sonar.exclusions=**/target/**,**/node_modules/**,apps/ui/out/**,docs/**,fuzz/**,\
  **/*.png,**/*.icns,**/*.ico,**/*.woff,**/*.woff2,**/*.loro

# Lines that no test could reach are not worth reporting, and the generated
# WASM bindings are not ours to cover.
sonar.coverage.exclusions=crates/wasm/**,apps/ui/**,scripts/**,**/tests/**,**/build.rs

# The LCOV report from cargo-llvm-cov is passed by the sonarcloud job in ci.yml,
# as an absolute path: SonarCloud reads a relative one per crate.

# typescript:S6478 ("don't define components inside components") takes the
# `pending` and `failed` props of `Region`, and other JSX passed as props, for
# nested component definitions. They are props: none is a component with its
# own state, so nothing is remounted on each render.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/ui/**

# typescript:S6819 would have `role="status"` become `<output>`. That element
# takes only phrasing content, and most of ours are block wrappers around
# loading skeletons, so the change would break the markup and the layout.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e2.resourceKey=apps/ui/**
