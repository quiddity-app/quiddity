[package]
name = "quiddity-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
jiff = "0.2"
quiddity-core = { path = "../crates/core" }
quiddity-sync = { path = "../crates/sync" }
quiddity-syntax = { path = "../crates/syntax" }

[[bin]]
name = "block"
path = "fuzz_targets/block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "outline"
path = "fuzz_targets/outline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "peer"
path = "fuzz_targets/peer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query"
path = "fuzz_targets/query.rs"
test = false
doc = false
bench = false
